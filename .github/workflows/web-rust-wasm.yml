name: Web Rust Wasm M1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Shared/GestureIMECoreWeb/**"
      - "Shared/GestureIMECoreRust/**"
      - "App/KeyboardExtension/Resources/default-ja.json"
      - ".github/workflows/web-rust-wasm.yml"

permissions:
  contents: read

jobs:
  wasm-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Wasm target
        run: |
          rustc --version
          cargo --version
          rustup target add wasm32-unknown-unknown
      - name: Native tests for actual Product Profile
        run: cargo test --manifest-path Shared/GestureIMECoreWeb/Cargo.toml
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Build native-core-backed Wasm modules
        run: |
          wasm-pack build Shared/GestureIMECoreWeb --target nodejs --release --out-dir pkg-node
          wasm-pack build Shared/GestureIMECoreWeb --target web --release --out-dir pkg-web
          test -s Shared/GestureIMECoreWeb/pkg-web/gesture_ime_core_web_bg.wasm
          test -s Shared/GestureIMECoreWeb/pkg-node/gesture_ime_core_web_bg.wasm
      - name: Execute exact native-versus-Wasm fixture parity
        run: |
          cargo run --quiet --manifest-path Shared/GestureIMECoreWeb/Cargo.toml \
            --example inspect_profile -- App/KeyboardExtension/Resources/default-ja.json \
            > "$RUNNER_TEMP/native-inspection.json"
          node - "$RUNNER_TEMP/native-inspection.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const ffi = require('./Shared/GestureIMECoreWeb/pkg-node/gesture_ime_core_web.js');
          const input = fs.readFileSync('App/KeyboardExtension/Resources/default-ja.json', 'utf8');
          const native = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const wasm = JSON.parse(ffi.inspect_profile(input));
          assert.deepStrictEqual(wasm, native, 'Wasm must call same Profile v3 Rust runtime');
          assert.equal(wasm.ok, true);
          assert.equal(wasm.profile.id, 'builtin.ja.product');
          assert.ok(wasm.profile.entries.length > 1);
          const invalid = JSON.parse(ffi.inspect_profile('{'));
          assert.equal(invalid.ok, false);
          console.log('M1 actual built-in Profile/native-Wasm parity PASS');
          NODE
      - name: Verify nonroot Board preview native-versus-Wasm parity
        run: |
          cargo run --quiet --manifest-path Shared/GestureIMECoreWeb/Cargo.toml \
            --example inspect_profile -- App/KeyboardExtension/Resources/default-ja.json \
            layer.ja board.base.kana.a.flick > "$RUNNER_TEMP/native-nonroot.json"
          node - "$RUNNER_TEMP/native-nonroot.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const api = require('./Shared/GestureIMECoreWeb/pkg-node/gesture_ime_core_web.js');
          const profile = fs.readFileSync('App/KeyboardExtension/Resources/default-ja.json','utf8');
          const native = JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const wasm = JSON.parse(api.inspect_board(profile,'layer.ja','board.base.kana.a.flick'));
          assert.deepStrictEqual(wasm,native);
          assert.equal(wasm.ok,true, JSON.stringify(wasm));
          assert.equal(wasm.profile.boardId,'board.base.kana.a.flick');
          assert.equal(wasm.profile.initialBoardId,'board.ja.root');
          assert.ok(wasm.profile.entries.length > 1);
          assert.equal(JSON.parse(api.inspect_board(profile,'layer.ja','missing')).ok,false);
          console.log('M3d selected internal Board/native-Wasm preview parity PASS');
          NODE
      - name: Real BoardSession gesture trace parity on actual Profile
        run: |
          set -euo pipefail
          for trace in spec/conformance/fixtures/web-m1b-*.json; do
            cargo run --quiet --manifest-path Shared/GestureIMECoreWeb/Cargo.toml \
              --example trace_profile -- \
              App/KeyboardExtension/Resources/default-ja.json "$trace" \
              > "$RUNNER_TEMP/native-trace.json"
            node - "$trace" "$RUNNER_TEMP/native-trace.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const ffi = require('./Shared/GestureIMECoreWeb/pkg-node/gesture_ime_core_web.js');
          const fixture = fs.readFileSync(process.argv[2], 'utf8');
          const profile = fs.readFileSync('App/KeyboardExtension/Resources/default-ja.json', 'utf8');
          const native = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const wasm = JSON.parse(ffi.trace_profile(profile, fixture));
          assert.deepStrictEqual(wasm, native, 'native/Wasm real BoardSessionV3 trace parity');
          assert.equal(wasm.ok, true, JSON.stringify(wasm));
          assert.ok(wasm.trace.samples.length >= 2);
          console.log('BoardSessionV3 native/Wasm trace parity PASS:', process.argv[2]);
          NODE
          done
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const ffi = require('./Shared/GestureIMECoreWeb/pkg-node/gesture_ime_core_web.js');
          const profile = fs.readFileSync('App/KeyboardExtension/Resources/default-ja.json', 'utf8');
          const invalid = JSON.stringify({entryId:'kana.a',cellWidth:50,cellHeight:50,touchDown:{x:0,y:0},startMs:100,events:[{kind:'up',atMs:90}]});
          assert.equal(JSON.parse(ffi.trace_profile(profile, invalid)).ok, false);
          NODE
      - name: Shared Rust editor command and Undo/Redo native-Wasm parity
        run: |
          cargo run --quiet --manifest-path Shared/GestureIMECoreWeb/Cargo.toml \
            --example editor_sequence -- \
            App/KeyboardExtension/Resources/default-ja.json \
            spec/conformance/fixtures/web-m2a-key-text.json \
            > "$RUNNER_TEMP/native-editor-sequence.json"
          node - "$RUNNER_TEMP/native-editor-sequence.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { WebProfileEditor } = require('./Shared/GestureIMECoreWeb/pkg-node/gesture_ime_core_web.js');
          const profile = fs.readFileSync('App/KeyboardExtension/Resources/default-ja.json', 'utf8');
          const command = fs.readFileSync('spec/conformance/fixtures/web-m2a-key-text.json', 'utf8');
          const expected = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const editor = new WebProfileEditor(profile);
          const afterApply = JSON.parse(editor.apply_command(command, 0));
          const afterUndo = JSON.parse(editor.undo());
          const afterRedo = JSON.parse(editor.redo());
          assert.deepStrictEqual({afterApply, afterUndo, afterRedo}, expected);
          assert.equal(afterRedo.snapshot.revision, 3);
          assert.equal(afterRedo.snapshot.canUndo, true);
          const stale = JSON.parse(editor.apply_command(command, 0));
          assert.equal(stale.ok, false);
          const afterStale = JSON.parse(editor.snapshot());
          assert.equal(afterStale.snapshot.revision, 3);
          editor.free();
          console.log('M2a shared Rust editor native-Wasm/Undo parity PASS');
          NODE
      - name: Upload Web binding proof (not a published website)
        uses: actions/upload-artifact@v4
        with:
          name: gesture-ime-wasm-m1
          path: Shared/GestureIMECoreWeb/pkg-web/
          if-no-files-found: error
