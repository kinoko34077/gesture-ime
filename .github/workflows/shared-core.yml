name: Shared Core and Swift Syntax

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "App/KeyboardExtension/**"
      - "Packages/GestureIMECore/**"
      - "spec/**"
      - ".github/workflows/shared-core.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: GestureIMECore tests
        working-directory: Packages/GestureIMECore
        run: swift test

      - name: Parse keyboard Swift sources
        run: |
          find App/KeyboardExtension -name '*.swift' -print0 |
            while IFS= read -r -d '' file; do
              echo "Parsing $file"
              swiftc -frontend -parse "$file"
            done

      - name: Validate built-in Profile JSON
        run: python3 -m json.tool App/KeyboardExtension/Resources/default-ja.json >/dev/null
