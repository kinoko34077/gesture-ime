name: iOS Keyboard Device Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "App/MainApp/**"
      - "App/KeyboardExtension/**"
      - "Packages/GestureIMECore/**"
      - "Packages/GestureIMEProfileAuthoring/**"
      - "Packages/GestureIMEProductSettings/**"
      - "Shared/GestureIMECoreRust/**"
      - "Platforms/iOS/SharedRuntime/**"
      - "project.yml"
      - ".gitmodules"
      - "Vendor/azooKey"
      - "scripts/build-ios-keyboard.sh"
      - "scripts/prepare-shared-runtime-ios.sh"
      - ".github/workflows/ios-keyboard.yml"

permissions:
  contents: read

jobs:
  build-keyboard-ipa:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
          xcodegen --version

      - name: Shared core tests
        working-directory: Shared/GestureIMECoreRust
        run: cargo test

      - name: Swift reference regression
        working-directory: Packages/GestureIMECore
        run: swift test

      - name: Profile authoring tests
        working-directory: Packages/GestureIMEProfileAuthoring
        run: swift test

      - name: Product settings tests
        working-directory: Packages/GestureIMEProductSettings
        run: swift test

      - name: Build unsigned keyboard IPA
        env:
          DERIVED_DATA: ${{ runner.temp }}/GestureIMEKeyboardDerivedData
          ARTIFACT_DIR: ${{ runner.temp }}/GestureIMEKeyboardArtifact
        run: bash scripts/build-ios-keyboard.sh

      - name: Upload sideload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureIME-keyboard-unsigned
          path: ${{ runner.temp }}/GestureIMEKeyboardArtifact/GestureIME-keyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
