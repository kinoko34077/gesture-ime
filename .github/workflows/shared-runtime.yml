name: Shared Rust Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Shared/GestureIMECoreRust/**"
      - "spec/conformance/**"
      - ".github/workflows/shared-runtime.yml"

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Canonical Rust tests
        working-directory: Shared/GestureIMECoreRust
        run: cargo test

  swift-binding:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: |
          rustc --version
          cargo --version
          swift --version
      - name: Build UniFFI library
        working-directory: Shared/GestureIMECoreRust
        run: cargo build
      - name: Generate Swift binding
        working-directory: Shared/GestureIMECoreRust
        run: |
          OUT="$RUNNER_TEMP/GestureIMECoreSwift"
          mkdir -p "$OUT"
          cargo run --bin uniffi-bindgen -- \
            target/debug/libgesture_ime_core.dylib \
            "$OUT" \
            --swift-sources \
            --headers \
            --modulemap \
            --module-name gesture_ime_coreFFI \
            --modulemap-filename gesture_ime_coreFFI.modulemap
          find "$OUT" -maxdepth 1 -type f -print
          test -n "$(find "$OUT" -maxdepth 1 -name '*.swift' -print -quit)"
          test -n "$(find "$OUT" -maxdepth 1 -name '*.h' -print -quit)"
          test -n "$(find "$OUT" -maxdepth 1 -name '*.modulemap' -print -quit)"
      - name: Typecheck generated Swift binding
        working-directory: Shared/GestureIMECoreRust
        run: |
          OUT="$RUNNER_TEMP/GestureIMECoreSwift"
          SWIFT_FILE="$(find "$OUT" -maxdepth 1 -name '*.swift' -print -quit)"
          MODULEMAP="$(find "$OUT" -maxdepth 1 -name '*.modulemap' ! -name 'module.modulemap' -print -quit)"
          cp "$MODULEMAP" "$OUT/module.modulemap"

          echo "--- generated Swift import preamble ---"
          sed -n '1,80p' "$SWIFT_FILE"
          echo "--- generated module map ---"
          cat "$OUT/module.modulemap"

          swiftc \
            -typecheck \
            -parse-as-library \
            -I "$OUT" \
            -L target/debug \
            -lgesture_ime_core \
            "$SWIFT_FILE"


  kotlin-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: |
          rustc --version
          cargo --version
          java -version
          kotlinc -version
          mvn -version
      - name: Build UniFFI library
        working-directory: Shared/GestureIMECoreRust
        run: cargo build
      - name: Generate Kotlin binding
        working-directory: Shared/GestureIMECoreRust
        run: |
          OUT="$RUNNER_TEMP/GestureIMECoreKotlin"
          mkdir -p "$OUT"
          cargo run --bin uniffi-bindgen-generic -- \
            generate \
            --library \
            --language kotlin \
            --out-dir "$OUT" \
            target/debug/libgesture_ime_core.so
          find "$OUT" -type f -print
          test -n "$(find "$OUT" -name '*.kt' -print -quit)"
      - name: Compile generated Kotlin binding
        working-directory: Shared/GestureIMECoreRust
        run: |
          OUT="$RUNNER_TEMP/GestureIMECoreKotlin"
          JNA_DIR="$RUNNER_TEMP/jna"
          mkdir -p "$JNA_DIR"
          mvn -q dependency:copy \
            -Dartifact=net.java.dev.jna:jna:5.12.1 \
            -DoutputDirectory="$JNA_DIR"
          JNA_JAR="$(find "$JNA_DIR" -name 'jna-*.jar' -print -quit)"
          mapfile -t KOTLIN_FILES < <(find "$OUT" -name '*.kt' -print)
          kotlinc "${KOTLIN_FILES[@]}" \
            -classpath "$JNA_JAR" \
            -d "$RUNNER_TEMP/gesture-ime-core-bindings.jar"
          test -s "$RUNNER_TEMP/gesture-ime-core-bindings.jar"
